<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Terminal</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      padding: 1rem;
    }
    #terminal {
      white-space: pre-wrap;
      min-height: 90vh;
    }
    .prompt {
      display: inline;
    }
    input {
      background: black;
      color: lime;
      border: none;
      outline: none;
      font-family: monospace;
      width: 90%;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="terminal"></div>
  <div class="prompt">
    <span>$</span>
    <input type="text" id="input" autofocus />
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('input');
    const history = [];
    let historyIndex = -1;

    const commands = {
     help: () => [
        'Available commands:',
        '',
        'help                  Show this list',
        'echo <text>           Repeat text',
        'clear                 Clear terminal',
        'about                 About this site',
        'fortune               Random fortune',
        'schwwaaa              Visit schwwaaa',
        'ascii [size] [seed]   Generate ASCII art',
        'morse <message>       Encode and play Morse code',
        'clock                 Open live clock',
        'stars                 Open starfield animation',
        'uuid [count]          Generate UUIDs',
        'screen                Display screen information',
        'browser               Display browser information',
        'cube                  Open rotating ASCII cube',
        'tree [depth]          Generate procedural tree',
        'city [width]          Generate city skyline',
        'maze [width] [height] Generate a maze',
        'mandelbrot [w] [h]    Render Mandelbrot set',
        'plasma                Open ASCII plasma animation',
        'password [length]     Generate secure password',
        'dice [sides] [count]  Roll dice',
        'coinflip [count]      Flip coins',
        'panic                 Trigger fake system panic',
        'movie <list>          Choose a movie'
      ].join('\n'),
    };

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      const value = input.value.trim();

      if (!value) {
        return;
      }

      history.unshift(value);
      historyIndex = -1;

      const parts = value.split(/\s+/);
      const commandName = parts.shift().toLowerCase();
      const args = parts;

      appendTerminal(`$ ${value}`);

      try {
        const command = commands[commandName];

        if (!command) {
          appendTerminal(`Command not found: ${commandName}`);
        } else {
          const output = command(args);

          if (output instanceof Promise) {
            output
              .then(result => {
                if (result !== undefined && result !== '') {
                  appendTerminal(String(result));
                }
              })
              .catch(error => {
                appendTerminal(`Error: ${error.message}`);
              });
          } else if (output !== undefined && output !== '') {
            appendTerminal(String(output));
          }
        }
      } catch (error) {
        appendTerminal(`Error: ${error.message}`);
        console.error(error);
      }

      input.value = '';

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }

    else if (event.key === 'ArrowUp') {
      event.preventDefault();

      if (history.length > 0) {
        historyIndex = Math.min(
          historyIndex + 1,
          history.length - 1
        );

        input.value = history[historyIndex];
      }
    }

    else if (event.key === 'ArrowDown') {
      event.preventDefault();

      if (historyIndex > 0) {
        historyIndex--;
        input.value = history[historyIndex];
      } else {
        historyIndex = -1;
        input.value = '';
      }
    }
  });


    function seededRandom(seed) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seed.length; i++) {
    h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
  }
  return function() {
    h += h << 13; h ^= h >>> 7;
    h += h << 3; h ^= h >>> 17;
    h += h << 5;
    return (h >>> 0) / 4294967296;
  };
}

commands['ascii'] = ([complexity = 'medium', seed = 'quantum']) => {
  const sizeMap = { small: 20, medium: 40, large: 80 };
  const width = sizeMap[complexity.toLowerCase()] || 40;
  const height = Math.floor(width * 0.5);

  // Seeded random
  function seededRandom(seed) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seed.length; i++) {
      h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
    }
    return function () {
      h += h << 13; h ^= h >>> 7;
      h += h << 3; h ^= h >>> 17;
      h += h << 5;
      return (h >>> 0) / 4294967296;
    };
  }

  const rand = seededRandom(seed + Date.now()); // always different

  const grid = Array.from({ length: height }, () => Array(width).fill(' '));
  const charSet = ['.', ':', '+', '*', '#', '%', '@', '=', '~', 'o'];

  const drawShape = () => {
    const mode = Math.floor(rand() * 5);
    const centerX = Math.floor(width / 2);
    const centerY = Math.floor(height / 2);

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        let char = ' ';
        const dx = x - centerX;
        const dy = y - centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);
        const index = Math.floor(rand() * charSet.length);

        switch (mode) {
          case 0: // Circle rings
            if (Math.abs(dist % 4 - 2) < 1.2) char = charSet[index];
            break;
          case 1: // Diagonals
            if ((x + y) % 7 === 0 || (x - y) % 7 === 0) char = charSet[index];
            break;
          case 2: // Spiral
            const theta = Math.atan2(dy, dx);
            const r = Math.sqrt(dx * dx + dy * dy);
            if (Math.abs(r - theta * 5) < 1.5) char = charSet[index];
            break;
          case 3: // Grid box
            if ((x % 5 === 0 || y % 3 === 0) && rand() > 0.3) char = charSet[index];
            break;
          case 4: // Starburst
            if (Math.abs(dx) === Math.abs(dy) || x === centerX || y === centerY) {
              if (rand() > 0.5) char = charSet[index];
            }
            break;
        }

        grid[y][x] = char;
      }
    }
  };

  drawShape();
  return grid.map(row => row.join('')).join('\n');
};



  </script>
  <script src="termhelpers.js"></script>
  
</body>
</html>
